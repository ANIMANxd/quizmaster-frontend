  <div class="main-content">

          <p>A complete overview of your platform's activity.</p>    </div>
    <!-- ▲▲▲ END OF WRAPPER ▲▲▲ -->

    <button id="hamburger-btn" class="hamburger-btn">

</header>

    <div class="content-wrapper">
        <section class="stats-grid" id="kpi-cards">

                </div>

                <h3>Lowest Scoring Quizzes</h3>

                    <canvas id="lowestScoreQuizChart"></canvas>
